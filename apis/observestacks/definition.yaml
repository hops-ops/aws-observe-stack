apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: observestacks.aws.hops.ops.com.ai
spec:
  group: aws.hops.ops.com.ai
  names:
    kind: ObserveStack
    plural: observestacks
  scope: Namespaced
  defaultCompositeDeletePolicy: Foreground
  versions:
  - name: v1alpha1
    referenceable: true
    served: true
    schema:
      openAPIV3Schema:
        description: ObserveStack deploys the observability stack with AWS Pod Identity for OpenCost billing access.
        type: object
        properties:
          spec:
            description: ObserveStackSpec defines the desired state.
            type: object
            properties:
              clusterName:
                description: Name of the target cluster. Used for provider config defaults and resource naming.
                type: string
              managementPolicies:
                description: Management policies for all composed resources. Defaults to ["*"].
                type: array
                items:
                  type: string
                default:
                - "*"
              labels:
                description: Custom labels applied to all managed resources.
                type: object
                additionalProperties:
                  type: string
                x-kubernetes-preserve-unknown-fields: true
              helmProviderConfigRef:
                description: Reference to the Helm ProviderConfig. Defaults to clusterName.
                type: object
                properties:
                  name:
                    description: Name of the Helm ProviderConfig.
                    type: string
                  kind:
                    description: Kind of the ProviderConfig. Defaults to ProviderConfig.
                    type: string
                    enum:
                    - ProviderConfig
                    - ClusterProviderConfig
              kubernetesProviderConfigRef:
                description: Reference to the Kubernetes ProviderConfig. Defaults to clusterName.
                type: object
                properties:
                  name:
                    description: Name of the Kubernetes ProviderConfig.
                    type: string
                  kind:
                    description: Kind of the ProviderConfig. Defaults to ProviderConfig.
                    type: string
                    enum:
                    - ProviderConfig
                    - ClusterProviderConfig
              awsProviderConfigRef:
                description: Reference to the AWS ProviderConfig. Defaults to "default".
                type: object
                properties:
                  name:
                    description: Name of the AWS ProviderConfig.
                    type: string
                  kind:
                    description: Kind of the ProviderConfig. Defaults to ProviderConfig.
                    type: string
              namespace:
                description: Shared namespace for all components. Defaults to monitoring.
                type: string
              storageClassDefaults:
                description: Default StorageClass settings used when components use storage.type=pvc.
                type: object
                properties:
                  create:
                    description: Whether to create StorageClass resources by default.
                    type: boolean
                    default: true
                  provisioner:
                    description: StorageClass provisioner.
                    type: string
                    default: ebs.csi.eks.amazonaws.com
                  parameters:
                    description: StorageClass parameters map.
                    type: object
                    additionalProperties:
                      type: string
                    x-kubernetes-preserve-unknown-fields: true
                  allowVolumeExpansion:
                    description: Whether PVC expansion is allowed.
                    type: boolean
                    default: true
                  reclaimPolicy:
                    description: StorageClass reclaim policy.
                    type: string
                    enum:
                    - Delete
                    - Retain
                    default: Delete
                  volumeBindingMode:
                    description: StorageClass volume binding mode.
                    type: string
                    enum:
                    - Immediate
                    - WaitForFirstConsumer
                    default: WaitForFirstConsumer
              ha:
                description: Optional easy HA mode. When enabled, HA-capable components get safe replica defaults and the XR renders PodDisruptionBudgets for observe workloads. Grafana HA composes a PSQLCluster-backed shared database before scaling. Loki and Tempo are only auto-scaled when their storage type is s3.
                type: object
                properties:
                  enabled:
                    description: Whether to enable easy HA mode. Defaults to false.
                    type: boolean
                    default: false
                  replicas:
                    description: Default replica count for HA-capable stateless/operator-managed components. Defaults to 2.
                    type: integer
                    minimum: 2
                    default: 2
                  pdb:
                    description: PodDisruptionBudget defaults used when HA mode is enabled.
                    type: object
                    properties:
                      enabled:
                        description: Whether to create PodDisruptionBudgets. Defaults to true when HA is enabled.
                        type: boolean
                        default: true
                      minAvailable:
                        description: Minimum available pods for generated PodDisruptionBudgets. Defaults to 1.
                        type: integer
                        minimum: 1
                        default: 1
                  components:
                    description: Per-component HA overrides keyed by component name, for example prometheus, alertmanager, grafana, opencost, loki, tempo, oauth2Proxy, or redis.
                    type: object
                    additionalProperties:
                      type: object
                      properties:
                        enabled:
                          description: Whether HA behavior is enabled for this component. Defaults to spec.ha.enabled.
                          type: boolean
                        replicas:
                          description: Replica count for this component when the component supports XR-managed replicas.
                          type: integer
                          minimum: 1
              nodePool:
                description: Optional dedicated Karpenter NodePool for observe workloads. When enabled, non-daemonset pods are scheduled to a dedicated NodePool via nodeSelector and tolerations. Daemonsets (node-exporter, alloy) continue to run on all nodes.
                type: object
                properties:
                  enabled:
                    description: Whether to create a dedicated NodePool for observe workloads. Defaults to false.
                    type: boolean
                    default: false
                  nodeClassName:
                    description: Name of the EKS NodeClass to reference. Defaults to "hops-default".
                    type: string
                  limits:
                    description: Karpenter NodePool resource limits. Defaults to cpu/memory-based limits for dynamic scaling. Set nodes to cap node count.
                    type: object
                    properties:
                      cpu:
                        description: Maximum total vCPUs across all nodes. Defaults to "40".
                        type: string
                        default: "40"
                      memory:
                        description: Maximum total memory across all nodes. Defaults to "160Gi".
                        type: string
                        default: "160Gi"
                      nodes:
                        description: Maximum number of nodes. Optional — omit for pure resource-based scaling.
                        type: integer
                  requirements:
                    description: Karpenter NodePool scheduling requirements. Defaults to spot capacity, c/m/r/t instance categories, generation >= 4, linux, and architecture-flexible scheduling.
                    type: array
                    items:
                      type: object
                      properties:
                        key:
                          type: string
                        operator:
                          type: string
                          enum:
                          - In
                          - NotIn
                          - Exists
                          - DoesNotExist
                          - Gt
                          - Gte
                          - Lt
                          - Lte
                        values:
                          type: array
                          items:
                            type: string
                      required:
                      - key
                      - operator
                  disruption:
                    description: Karpenter disruption settings. Defaults to WhenEmptyOrUnderutilized after 30s with a 100% NodePool disruption budget.
                    type: object
                    properties:
                      consolidationPolicy:
                        description: Consolidation policy. Defaults to WhenEmptyOrUnderutilized.
                        type: string
                        enum:
                        - WhenEmpty
                        - WhenEmptyOrUnderutilized
                        default: WhenEmptyOrUnderutilized
                      consolidateAfter:
                        description: Duration to wait before consolidating. Defaults to 30s.
                        type: string
                        default: "30s"
                      budgets:
                        description: NodePool disruption budgets. Defaults to nodes=100%.
                        type: array
                        items:
                          type: object
                          properties:
                            nodes:
                              description: Number or percentage of nodes that may be disrupted.
                              type: string
                            schedule:
                              description: Optional UTC cron schedule for this budget.
                              type: string
                            duration:
                              description: Duration for a scheduled budget.
                              type: string
                            reasons:
                              description: Disruption reasons this budget applies to.
                              type: array
                              items:
                                type: string
                                enum:
                                - Empty
                                - Underutilized
                                - Drifted
                          required:
                          - nodes
              aws:
                description: AWS account and IAM configuration.
                type: object
                properties:
                  region:
                    description: AWS region for the EKS cluster.
                    type: string
                  permissionsBoundaryArn:
                    description: ARN of the IAM permissions boundary to apply to the role.
                    type: string
                  rolePrefix:
                    description: Prefix for the IAM role name.
                    type: string
                  tags:
                    description: Custom tags applied to AWS resources.
                    type: object
                    additionalProperties:
                      type: string
                    x-kubernetes-preserve-unknown-fields: true
                required:
                - region
              kubePrometheusStack:
                description: Configuration for the kube-prometheus-stack component.
                type: object
                properties:
                  name:
                    description: Release name. Defaults to kube-prometheus-stack.
                    type: string
                  namespace:
                    description: Namespace override for this component.
                    type: string
                  values:
                    description: Helm values merged with chart and cross-component defaults.
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
                  overrideAllValues:
                    description: Helm values that replace all defaults for this component.
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
                  storage:
                    description: Storage configuration for Prometheus.
                    type: object
                    properties:
                      retentionDays:
                        description: Retention period in days for metric data.
                        type: integer
                        default: 30
                      retentionSize:
                        description: Maximum on-disk size retained by Prometheus. Keep this below the PVC size so WAL replay and compaction have free space.
                        type: string
                        default: 8GB
                      size:
                        description: Requested PVC size for Prometheus.
                        type: string
                        default: 10Gi
                      storageClass:
                        description: StorageClass settings for Prometheus PVCs.
                        type: object
                        properties:
                          name:
                            description: StorageClass name for Prometheus PVCs.
                            type: string
                            default: prometheus
                          create:
                            description: Whether to create this StorageClass. Defaults to storageClassDefaults.create.
                            type: boolean
                          provisioner:
                            description: Provisioner override for this component.
                            type: string
                          parameters:
                            description: Parameters override for this component.
                            type: object
                            additionalProperties:
                              type: string
                            x-kubernetes-preserve-unknown-fields: true
                          allowVolumeExpansion:
                            description: allowVolumeExpansion override for this component.
                            type: boolean
                          reclaimPolicy:
                            description: Reclaim policy override for this component.
                            type: string
                            enum:
                            - Delete
                            - Retain
                          volumeBindingMode:
                            description: Volume binding mode override for this component.
                            type: string
                            enum:
                            - Immediate
                            - WaitForFirstConsumer
              loki:
                description: Configuration for the Loki component.
                type: object
                properties:
                  name:
                    description: Release name. Defaults to loki.
                    type: string
                  namespace:
                    description: Namespace override for this component.
                    type: string
                  values:
                    description: Helm values merged with chart defaults.
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
                  overrideAllValues:
                    description: Helm values that replace all defaults for this component.
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
                  storage:
                    description: Storage configuration for Loki.
                    type: object
                    properties:
                      type:
                        description: Storage backend type. Use "pvc" for PVC-backed filesystem storage, or "s3" for S3 object storage.
                        type: string
                        enum:
                        - pvc
                        - s3
                        default: pvc
                      retentionDays:
                        description: Retention period in days for log data. Applied to Loki limits_config and S3 lifecycle when using S3.
                        type: integer
                        default: 30
                      size:
                        description: Requested PVC size for Loki when type=pvc.
                        type: string
                        default: 10Gi
                      storageClass:
                        description: StorageClass settings for Loki when type=pvc.
                        type: object
                        properties:
                          name:
                            description: StorageClass name for Loki PVCs.
                            type: string
                            default: loki
                          create:
                            description: Whether to create this StorageClass. Defaults to storageClassDefaults.create.
                            type: boolean
                          provisioner:
                            description: Provisioner override for this component.
                            type: string
                          parameters:
                            description: Parameters override for this component.
                            type: object
                            additionalProperties:
                              type: string
                            x-kubernetes-preserve-unknown-fields: true
                          allowVolumeExpansion:
                            description: allowVolumeExpansion override for this component.
                            type: boolean
                          reclaimPolicy:
                            description: Reclaim policy override for this component.
                            type: string
                            enum:
                            - Delete
                            - Retain
                          volumeBindingMode:
                            description: Volume binding mode override for this component.
                            type: string
                            enum:
                            - Immediate
                            - WaitForFirstConsumer
                      s3:
                        description: S3 settings used when type=s3.
                        type: object
                        properties:
                          bucketName:
                            description: S3 bucket name. Defaults to {name}-loki-storage.
                            type: string
                          retentionDays:
                            description: Deprecated. Use storage.retentionDays instead. Falls back to this if storage.retentionDays is not set.
                            type: integer
                            default: 30
              tempo:
                description: Configuration for the Tempo component.
                type: object
                properties:
                  name:
                    description: Release name. Defaults to tempo.
                    type: string
                  namespace:
                    description: Namespace override for this component.
                    type: string
                  values:
                    description: Helm values merged with chart and cross-component defaults.
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
                  overrideAllValues:
                    description: Helm values that replace all defaults for this component.
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
                  storage:
                    description: Storage configuration for Tempo.
                    type: object
                    properties:
                      type:
                        description: Storage backend type. Use "pvc" for PVC-backed local storage, or "s3" for S3 object storage.
                        type: string
                        enum:
                        - pvc
                        - s3
                        default: pvc
                      retentionDays:
                        description: Retention period in days for trace data. Applied to Tempo compactor and S3 lifecycle when using S3.
                        type: integer
                        default: 30
                      size:
                        description: Requested PVC size for Tempo when type=pvc.
                        type: string
                        default: 10Gi
                      storageClass:
                        description: StorageClass settings for Tempo when type=pvc.
                        type: object
                        properties:
                          name:
                            description: StorageClass name for Tempo PVCs.
                            type: string
                            default: tempo
                          create:
                            description: Whether to create this StorageClass. Defaults to storageClassDefaults.create.
                            type: boolean
                          provisioner:
                            description: Provisioner override for this component.
                            type: string
                          parameters:
                            description: Parameters override for this component.
                            type: object
                            additionalProperties:
                              type: string
                            x-kubernetes-preserve-unknown-fields: true
                          allowVolumeExpansion:
                            description: allowVolumeExpansion override for this component.
                            type: boolean
                          reclaimPolicy:
                            description: Reclaim policy override for this component.
                            type: string
                            enum:
                            - Delete
                            - Retain
                          volumeBindingMode:
                            description: Volume binding mode override for this component.
                            type: string
                            enum:
                            - Immediate
                            - WaitForFirstConsumer
                      s3:
                        description: S3 settings used when type=s3.
                        type: object
                        properties:
                          bucketName:
                            description: S3 bucket name. Defaults to {name}-tempo-storage.
                            type: string
                          retentionDays:
                            description: Deprecated. Use storage.retentionDays instead. Falls back to this if storage.retentionDays is not set.
                            type: integer
                            default: 30
              k8sMonitoring:
                description: Configuration for the k8s-monitoring component.
                type: object
                properties:
                  name:
                    description: Release name. Defaults to k8s-monitoring.
                    type: string
                  namespace:
                    description: Namespace override for this component.
                    type: string
                  values:
                    description: Helm values merged with chart and cross-component defaults.
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
                  overrideAllValues:
                    description: Helm values that replace all defaults for this component.
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
              grafanaOperator:
                description: Configuration for the Grafana Operator component.
                type: object
                properties:
                  name:
                    description: Release name. Defaults to grafana-operator.
                    type: string
                  namespace:
                    description: Namespace override for this component.
                    type: string
                  values:
                    description: Helm values passed to the Grafana Operator chart.
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
                  overrideAllValues:
                    description: Helm values that replace all defaults for this component.
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
              grafana:
                description: Grafana application settings for the kube-prometheus-stack Grafana deployment.
                type: object
                properties:
                  database:
                    description: Shared Grafana application database. Defaults on when Grafana HA is enabled.
                    type: object
                    properties:
                      enabled:
                        description: Whether to compose and wire a shared database for Grafana. Defaults to spec.ha.components.grafana.enabled.
                        type: boolean
                      sslMode:
                        description: Grafana Postgres ssl_mode. Defaults to disable for in-cluster CNPG service traffic.
                        type: string
                        default: disable
                      embedded:
                        description: Embedded PSQLCluster settings for the Grafana application database.
                        type: object
                        properties:
                          name:
                            description: PSQLCluster name. Defaults to {observe-name}-grafana-pg.
                            type: string
                          instances:
                            description: Base Postgres instance count when embedded HA is disabled. Defaults to 1.
                            type: integer
                            default: 1
                          storage:
                            description: Postgres data PVC sizing for the embedded PSQLCluster.
                            type: object
                            properties:
                              size:
                                description: PVC size. Defaults to 10Gi.
                                type: string
                                default: 10Gi
                              class:
                                description: StorageClass name. Defaults to psql.
                                type: string
                                default: psql
                          postgresql:
                            description: Postgres version and parameters for the embedded PSQLCluster.
                            type: object
                            properties:
                              version:
                                description: Postgres major version. Defaults to 17.
                                type: string
                                # renovate: datasource=docker depName=library/postgres registryUrl=https://index.docker.io
                                default: "17"
                              parameters:
                                description: postgres.conf parameters.
                                type: object
                                additionalProperties:
                                  type: string
                                x-kubernetes-preserve-unknown-fields: true
                          app:
                            description: Grafana database role and database name.
                            type: object
                            properties:
                              role:
                                description: Postgres role. Defaults to grafana.
                                type: string
                                default: grafana
                              database:
                                description: Postgres database. Defaults to grafana.
                                type: string
                                default: grafana
                              secretName:
                                description: Optional BYO app Secret name with username and password keys. Omit to let CNPG generate {cluster-name}-app.
                                type: string
                          ha:
                            description: HA settings for the embedded PSQLCluster. Defaults on when Grafana HA is enabled.
                            type: object
                            properties:
                              enabled:
                                description: Whether the embedded PSQLCluster should run with HA instances.
                                type: boolean
                              replicas:
                                description: Embedded PSQLCluster HA replica count. Defaults to 3.
                                type: integer
                                default: 3
                              topologySpreadByZone:
                                description: Whether embedded Postgres pods should prefer zone spread. Defaults to true.
                                type: boolean
                                default: true
                          monitoring:
                            description: Monitoring settings for the embedded PSQLCluster.
                            type: object
                            properties:
                              enabled:
                                description: Whether the embedded PSQLCluster should enable CNPG PodMonitor output. Defaults to true.
                                type: boolean
                                default: true
                          cnpg:
                            description: Escape hatch for embedded PSQLCluster CNPG settings.
                            type: object
                            properties:
                              values:
                                description: Values merged with generated CNPG Cluster spec.
                                type: object
                                x-kubernetes-preserve-unknown-fields: true
                              overrideAllValues:
                                description: Values that replace the generated CNPG Cluster spec.
                                type: object
                                x-kubernetes-preserve-unknown-fields: true
              vpa:
                description: Configuration for the Vertical Pod Autoscaler component.
                type: object
                properties:
                  name:
                    description: Release name. Defaults to vpa.
                    type: string
                  namespace:
                    description: Namespace override for this component.
                    type: string
                  values:
                    description: Helm values passed to the VPA chart.
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
                  overrideAllValues:
                    description: Helm values that replace all defaults for this component.
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
              goldilocks:
                description: Configuration for the Goldilocks component. Monitors all namespaces by default.
                type: object
                properties:
                  name:
                    description: Release name. Defaults to goldilocks.
                    type: string
                  namespace:
                    description: Namespace override for this component.
                    type: string
                  values:
                    description: Helm values merged with chart defaults.
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
                  overrideAllValues:
                    description: Helm values that replace all defaults for this component.
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
              metricsServer:
                description: Optional metrics-server deployment for kubectl top and HPA support.
                type: object
                properties:
                  enabled:
                    description: Whether to deploy metrics-server. Defaults to false.
                    type: boolean
                    default: false
                  values:
                    description: Helm values merged with chart defaults.
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
                  overrideAllValues:
                    description: Helm values that replace all defaults.
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
              spotFeed:
                description: Spot instance pricing feed for OpenCost. Requires a SpotFeed XRD deployed in the same AWS account.
                type: object
                properties:
                  enabled:
                    description: Whether to configure OpenCost with spot pricing data from S3. Defaults to false.
                    type: boolean
                    default: false
                  bucketName:
                    description: Name of the S3 bucket containing spot datafeed data. Required when enabled.
                    type: string
                  region:
                    description: AWS region of the spot feed S3 bucket. Defaults to aws.region.
                    type: string
                  accountId:
                    description: AWS account ID for spot feed. Required when enabled.
                    type: string
                  prefix:
                    description: S3 key prefix for spot datafeed files.
                    type: string
              cloudCosts:
                description: AWS cloud cost integration via CUR/Athena for OpenCost. Requires a CostReport XRD deployed in the same AWS account.
                type: object
                x-kubernetes-validations:
                - rule: "self.enabled != true || (has(self.costReportRef) && self.costReportRef.enabled == true) || (has(self.bucketName) && self.bucketName != '')"
                  message: cloudCosts.bucketName is required when cloudCosts.enabled is true and cloudCosts.costReportRef.enabled is not true.
                - rule: "self.enabled != true || (has(self.costReportRef) && self.costReportRef.enabled == true) || (has(self.accountId) && self.accountId != '')"
                  message: cloudCosts.accountId is required when cloudCosts.enabled is true and cloudCosts.costReportRef.enabled is not true.
                - rule: "self.enabled != true || (has(self.costReportRef) && self.costReportRef.enabled == true) || (has(self.databaseName) && self.databaseName != '')"
                  message: cloudCosts.databaseName is required when cloudCosts.enabled is true and cloudCosts.costReportRef.enabled is not true.
                - rule: "self.enabled != true || (has(self.costReportRef) && self.costReportRef.enabled == true) || (has(self.tableName) && self.tableName != '')"
                  message: cloudCosts.tableName is required when cloudCosts.enabled is true and cloudCosts.costReportRef.enabled is not true.
                - rule: "self.enabled != true || (has(self.costReportRef) && self.costReportRef.enabled == true) || (has(self.workgroupName) && self.workgroupName != '')"
                  message: cloudCosts.workgroupName is required when cloudCosts.enabled is true and cloudCosts.costReportRef.enabled is not true.
                - rule: "!has(self.costReportRef) || self.costReportRef.enabled != true || self.enabled == true"
                  message: cloudCosts.enabled must be true when cloudCosts.costReportRef.enabled is true.
                - rule: "!has(self.costReportRef) || self.costReportRef.enabled != true || (has(self.costReportRef.name) && self.costReportRef.name != '')"
                  message: cloudCosts.costReportRef.name is required when cloudCosts.costReportRef.enabled is true.
                - rule: "!has(self.costReportRef) || self.costReportRef.enabled != true || (has(self.costReportRef.accountId) && self.costReportRef.accountId != '')"
                  message: cloudCosts.costReportRef.accountId is required when cloudCosts.costReportRef.enabled is true.
                properties:
                  enabled:
                    description: Whether to enable cloud cost integration via Athena. Defaults to false.
                    type: boolean
                    default: false
                  costReportRef:
                    description: Reference information for a separately managed CostReport XR. Use this to derive CUR/Athena names from the account-level CostReport.
                    type: object
                    properties:
                      enabled:
                        description: Whether to derive cloudCosts settings from a separately managed CostReport. When true, cloudCosts.enabled must also be true.
                        type: boolean
                        default: false
                      name:
                        description: Name of the CostReport XR. Required when enabled.
                        type: string
                      namespace:
                        description: Namespace of the CostReport XR. Defaults to the ObserveStack namespace.
                        type: string
                      accountId:
                        description: AWS account ID for the CostReport XR. Required when enabled.
                        type: string
                      region:
                        description: AWS region for the CostReport XR. Defaults to aws.region.
                        type: string
                      bucketName:
                        description: S3 bucket name override from the CostReport. Defaults to {name}-cur.
                        type: string
                      reportName:
                        description: CUR report/table name override from the CostReport. Defaults to {name}_cur.
                        type: string
                      databaseName:
                        description: Glue catalog database name override from the CostReport. Defaults to {name}_cur.
                        type: string
                      workgroupName:
                        description: Athena workgroup name override from the CostReport. Defaults to {name}-cur-workgroup.
                        type: string
                  bucketName:
                    description: "Manual fallback: base S3 bucket name used for CUR storage and Athena results. OpenCost derives the Athena query-results location as s3://{bucketName}/athena-results. Required when cloudCosts.enabled is true and cloudCosts.costReportRef.enabled is not true."
                    type: string
                  region:
                    description: "Manual fallback: AWS region of the Athena workgroup and Glue database. Defaults to aws.region."
                    type: string
                  accountId:
                    description: "Manual fallback: AWS account ID. Required when cloudCosts.enabled is true and cloudCosts.costReportRef.enabled is not true."
                    type: string
                  databaseName:
                    description: "Manual fallback: Glue catalog database name containing CUR tables. Required when cloudCosts.enabled is true and cloudCosts.costReportRef.enabled is not true."
                    type: string
                  tableName:
                    description: "Manual fallback: Glue table name for CUR data. Typically the CUR report name (with underscores). Required when cloudCosts.enabled is true and cloudCosts.costReportRef.enabled is not true."
                    type: string
                  workgroupName:
                    description: "Manual fallback: Athena workgroup name. Required when cloudCosts.enabled is true and cloudCosts.costReportRef.enabled is not true."
                    type: string
              auth:
                description: |
                  AuthStack integration. Identity-only — AuthStack publishes the OIDC issuer URL
                  and the AWS Secrets Manager path holding the iam-admin PAT. ObserveStack composes
                  an ExternalSecret + Zitadel ProviderConfig + Zitadel OIDC Application in its own
                  namespace, and oauth2-proxy / Redis live with it. No data-path coupling to AuthStack.
                  See specs/platform-public-exposure.
                type: object
                properties:
                  authStackRef:
                    description: Reference to the AuthStack XR that publishes the OIDC issuer + AWS SM credentials path. Currently informational — operator wires up the actual fields below.
                    type: object
                    properties:
                      name:
                        type: string
                      namespace:
                        type: string
                  issuerURL:
                    description: Zitadel issuer URL (host portion of status.oidc.issuerURL from AuthStack), e.g., https://auth.ops.com.ai.
                    type: string
                  zitadelDomain:
                    description: Zitadel domain (host only) for the embedded ProviderConfig credentials JSON. Defaults to the host of issuerURL.
                    type: string
                  awsSecretsManagerPath:
                    description: AWS Secrets Manager key holding the iam-admin PAT (AuthStack status.providerConfig.awsSecretsManagerPath). Typical shape "push/<cluster>/zitadel-credentials".
                    type: string
                  accessTokenProperty:
                    description: Property within the AWS SM JSON to extract for the PAT. Defaults to "access_token".
                    type: string
                    default: access_token
                  secretStoreRef:
                    description: Reference to the External Secrets store containing the Zitadel PAT. Defaults to the legacy ClusterSecretStore "hops-aws-secrets-manager" for backward compatibility; set this explicitly when SecretStack uses a different name or scope.
                    type: object
                    default: {}
                    properties:
                      name:
                        description: Name of the SecretStore or ClusterSecretStore. Defaults to "hops-aws-secrets-manager" for backward compatibility.
                        type: string
                        default: hops-aws-secrets-manager
                      kind:
                        description: Kind of External Secrets store. Defaults to ClusterSecretStore.
                        type: string
                        default: ClusterSecretStore
                        enum:
                        - SecretStore
                        - ClusterSecretStore
                  zitadelProjectId:
                    description: Zitadel project ID where ObserveStack creates the oauth2-proxy OIDC application. Operator-provided — AuthStack does not compose Zitadel Projects.
                    type: string
              exposure:
                description: |
                  Public exposure of observe-stack dashboards behind an OIDC-aware oauth2-proxy
                  bridge per specs/platform-public-exposure. The bridge lives in the observe
                  namespace, registers as an ext_authz provider on IstioStack, and gates per-
                  component HTTPRoutes via AuthorizationPolicy.CUSTOM. Grafana app-level OIDC
                  is a sibling task (observe-stack-grafana-oidc) and not covered here.
                type: object
                properties:
                  enabled:
                    description: Whether to compose the exposure bridge + per-component HTTPRoutes/policies. Defaults to false.
                    type: boolean
                    default: false
                  domain:
                    description: Exposure domain (e.g., "observe.ops.com.ai" or "ops.com.ai"). Cookie domain + Certificate dnsName + HTTPRoute host suffix are derived from this. Required when enabled is true.
                    type: string
                  gatewayRef:
                    description: Gateway API parentRef the per-host HTTPRoutes attach to. Defaults to istio-ingress/platform/[http,https-apex] so OAuth flows that redirect to HTTPS (cookie-secure=true) complete end-to-end.
                    type: object
                    properties:
                      name:
                        type: string
                        default: platform
                      namespace:
                        type: string
                        default: istio-ingress
                      sectionNames:
                        description: Listener names on the parent Gateway to attach to. Each becomes a separate parentRef entry on the HTTPRoute. Defaults to [http, https-apex] which covers both initial HTTP requests and the post-OIDC callback over HTTPS.
                        type: array
                        items:
                          type: string
                        default:
                        - http
                        - https-apex
                  extensionProviderName:
                    description: Name to register with IstioStack spec.extensionProviders[].name. Convention is <stack-namespace>-oauth2-proxy. Defaults to "<observe-namespace>-oauth2-proxy".
                    type: string
                  certificate:
                    description: Wildcard TLS certificate composition via cert-manager. Skip when the exposure domain is already covered by an existing wildcard certificate at the Gateway.
                    type: object
                    properties:
                      enabled:
                        description: Whether to compose a cert-manager Certificate resource. Defaults to false (assume the Gateway's wildcard listener already covers exposure.domain).
                        type: boolean
                        default: false
                      issuerRef:
                        description: cert-manager Issuer / ClusterIssuer reference.
                        type: object
                        properties:
                          name:
                            type: string
                            default: cloudflare-cluster-issuer
                          kind:
                            type: string
                            enum:
                            - Issuer
                            - ClusterIssuer
                            default: ClusterIssuer
                      secretName:
                        description: K8s Secret name for the issued cert. Defaults to "<observe-namespace>-exposure-tls".
                        type: string
                      secretNamespace:
                        description: Namespace for the issued cert Secret. Defaults to istio-ingress so the platform Gateway HTTPS listener can reference it.
                        type: string
                        default: istio-ingress
                  redis:
                    description: oauth2-proxy session backend (single-replica Redis with PVC). Sessions are disposable — Pod restart forces re-login, which is acceptable.
                    type: object
                    properties:
                      size:
                        description: PVC size for the Redis StatefulSet. Defaults to 1Gi.
                        type: string
                        default: 1Gi
                      storageClassName:
                        description: StorageClass for the Redis PVC. Defaults to the cluster's default.
                        type: string
                      image:
                        description: Redis container image. Defaults to "mirror.gcr.io/redis:7-alpine".
                        type: string
                        # renovate: datasource=docker depName=library/redis registryUrl=https://index.docker.io
                        default: mirror.gcr.io/redis:7-alpine
                  oauth2Proxy:
                    description: oauth2-proxy bridge configuration.
                    type: object
                    properties:
                      image:
                        description: oauth2-proxy container image. Defaults to "quay.io/oauth2-proxy/oauth2-proxy:v7.7.1".
                        type: string
                        # renovate: datasource=docker depName=oauth2-proxy/oauth2-proxy registryUrl=https://quay.io
                        default: quay.io/oauth2-proxy/oauth2-proxy:v7.15.4
                      replicas:
                        description: oauth2-proxy Deployment replicas. Defaults to 1.
                        type: integer
                        default: 1
                      additionalConfig:
                        description: Additional oauth2-proxy CLI flags to append (e.g., "--whitelist-domain=*.observe.ops.com.ai"). One flag per list entry.
                        type: array
                        items:
                          type: string
                      cookieDomain:
                        description: Cookie domain (e.g., ".observe.ops.com.ai"). Defaults to ".<exposure.domain>".
                        type: string
                      cookieSecretRef:
                        description: |
                          Reference to a Secret in the observe namespace holding the cookie-signing key.
                          Operator pre-creates it once -kubectl create secret generic <name> --from-literal=<key>=$(openssl rand -hex 16) -n <observe-ns>-. Required when exposure.enabled is true.
                        type: object
                        properties:
                          name:
                            type: string
                          key:
                            type: string
                            default: cookie_secret
                  prometheus:
                    description: Public exposure for the Prometheus UI. Skips if disabled.
                    type: object
                    properties:
                      enabled:
                        type: boolean
                        default: false
                      host:
                        description: Hostname for the HTTPRoute (e.g., "prometheus.observe.ops.com.ai").
                        type: string
                      serviceName:
                        description: Upstream service name. Defaults to "observe-prometheus", matching the stack's fullname override. Kept for backward compatibility; the composition routes through a sister Service named "exposure-prometheus" that mirrors the same pods via podSelector.
                        type: string
                        default: observe-prometheus
                      servicePort:
                        description: Upstream service port. Defaults to 9090.
                        type: integer
                        default: 9090
                      podSelector:
                        description: Selector for the upstream component's pods. The composition emits a sister Service (exposure-prometheus) with this selector, labeled istio.io/use-waypoint=<observe-ns>-waypoint, so the Waypoint intercepts traffic and the AuthorizationPolicy.CUSTOM fires. Defaults match the fullname override rendered by this stack.
                        type: object
                        additionalProperties:
                          type: string
                        x-kubernetes-preserve-unknown-fields: true
                  alertmanager:
                    description: Public exposure for the Alertmanager UI.
                    type: object
                    properties:
                      enabled:
                        type: boolean
                        default: false
                      host:
                        type: string
                      serviceName:
                        type: string
                        default: observe-alertmanager
                      servicePort:
                        type: integer
                        default: 9093
                      podSelector:
                        type: object
                        additionalProperties:
                          type: string
                        x-kubernetes-preserve-unknown-fields: true
                  opencost:
                    description: Public exposure for the OpenCost UI.
                    type: object
                    properties:
                      enabled:
                        type: boolean
                        default: false
                      host:
                        type: string
                      serviceName:
                        type: string
                        default: opencost
                      servicePort:
                        type: integer
                        default: 9090
                      podSelector:
                        type: object
                        additionalProperties:
                          type: string
                        x-kubernetes-preserve-unknown-fields: true
                  grafana:
                    description: |
                      Public exposure for Grafana with app-level OIDC (Grafana speaks OIDC
                      natively — per `feedback_app_level_oidc`, app-level integration beats
                      proxy-trust for refresh tokens, sign-out, WebSocket auth). Composes
                      a dedicated Zitadel OIDC Application and wires Grafana Helm values
                      under spec.kubePrometheusStack.values.grafana — no AuthorizationPolicy.CUSTOM
                      gate, Grafana enforces auth itself.
                    type: object
                    x-kubernetes-validations:
                    - rule: "self.enabled != true || (has(self.host) && self.host != '')"
                      message: exposure.grafana.host is required when exposure.grafana.enabled is true.
                    properties:
                      enabled:
                        type: boolean
                        default: false
                      host:
                        description: Hostname for the HTTPRoute (e.g., "grafana.ops.com.ai").
                        type: string
                      serviceName:
                        description: Upstream Grafana Service name. Defaults to "grafana" (kube-prometheus-stack chart's default).
                        type: string
                        default: grafana
                      servicePort:
                        description: Upstream Grafana Service port. Defaults to 80.
                        type: integer
                        default: 80
                      podSelector:
                        description: Selector for Grafana pods. Defaults to stock kube-prometheus-stack chart labels.
                        type: object
                        additionalProperties:
                          type: string
                        x-kubernetes-preserve-unknown-fields: true
                      allowedDomains:
                        description: Email-domain allow-list. Maps to grafana.ini auth.generic_oauth.allowed_domains (comma-joined).
                        type: array
                        items:
                          type: string
                      roleAttributePath:
                        description: JMESPath against the OAuth token/userinfo payload to map to a Grafana role (GrafanaAdmin, Admin, Editor, Viewer). Returning GrafanaAdmin also requires allowAssignGrafanaAdmin=true.
                        type: string
                      allowAssignGrafanaAdmin:
                        description: Whether Grafana may assign server administrator privileges when roleAttributePath returns GrafanaAdmin. Defaults to false.
                        type: boolean
                        default: false
                      maxSessionDuration:
                        description: Grafana session lifetime (auth.login_maximum_lifetime_duration). Defaults to 8h.
                        type: string
                        default: "8h"
                      tokenRotationMinutes:
                        description: Grafana token rotation interval (auth.token_rotation_interval_minutes). Defaults to 10.
                        type: integer
                        default: 10
                      useRefreshToken:
                        description: Whether to use OIDC refresh tokens (auth.generic_oauth.use_refresh_token). Defaults to true.
                        type: boolean
                        default: true
                      autoLogin:
                        description: Auto-redirect to Zitadel on first page load (auth.oauth_auto_login). Defaults to false to avoid surprise redirects.
                        type: boolean
                        default: false
                      orgAttributePath:
                        description: Optional JMESPath for org assignment (auth.generic_oauth.org_attribute_path).
                        type: string
                      orgMapping:
                        description: Optional org mapping list (auth.generic_oauth.org_mapping, comma-joined).
                        type: array
                        items:
                          type: string
            required:
            - clusterName
            - aws
          status:
            description: ObserveStackStatus defines the observed state.
            type: object
            properties:
              ready:
                description: Overall readiness.
                type: boolean
              exposure:
                description: Public exposure status — per-component URLs populated once HTTPRoutes are programmed and the upstream / oauth2-proxy / Redis are Ready.
                type: object
                properties:
                  domain:
                    type: string
                  extensionProviderName:
                    description: Name registered with IstioStack. Operators add a matching entry to IstioStack spec.extensionProviders[] (no auto-discovery in v1).
                    type: string
                  cookieDomain:
                    type: string
                  oauth2Proxy:
                    type: object
                    properties:
                      ready:
                        type: boolean
                      redisReady:
                        type: boolean
                      oidcClientReady:
                        description: True when the Zitadel OIDC Application MR is Ready and the connection Secret has been written.
                        type: boolean
                  prometheus:
                    type: object
                    properties:
                      enabled:
                        type: boolean
                      url:
                        type: string
                      ready:
                        type: boolean
                  alertmanager:
                    type: object
                    properties:
                      enabled:
                        type: boolean
                      url:
                        type: string
                      ready:
                        type: boolean
                  opencost:
                    type: object
                    properties:
                      enabled:
                        type: boolean
                      url:
                        type: string
                      ready:
                        type: boolean
                  grafana:
                    type: object
                    properties:
                      enabled:
                        type: boolean
                      url:
                        type: string
                      ready:
                        type: boolean
                      oidcClientReady:
                        description: True when the dedicated Grafana Zitadel OIDC Application MR is Ready.
                        type: boolean
        required:
        - spec
